name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths:
      - .github/workflows/publish.yml

jobs:
  discover:
    name: Discover Packages

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.discovery.outputs.matrix }}

    steps:
      - uses: actions/checkout@v6

      - name: Discover Packages
        id: discovery
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          entries=()

          add_package() {
            local dir="$1"

            name=$(basename "$dir")
            [[ "$name" =~ \.Test$ ]] && return

            entries+=("{ \"path\": \"${dir}\" }")

            echo "discovered: path=${dir}"
          }

          # Engines/<Package>
          for dir in Engines/*/; do
            add_package "$dir"
          done

          # Themes/<Package>
          for dir in Themes/*/; do
            add_package "$dir"
          done

          # Bundles/<Package>
          for dir in Bundles/*/; do
            add_package "$dir"
          done

          # Languages/<Language>/<Package>
          for language in Languages/*/; do
            for dir in "$language"*/; do
              add_package "$dir"
            done
          done

          json="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"

          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish NuGet Packages

    needs: discover

    runs-on: ubuntu-latest

    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'nuget.org' || 'dry-run' }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5

      - name: Build
        run: dotnet build -c Release

      - name: Publish
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          shopt -s nullglob
          dotnet nuget push "${{ matrix.path }}/bin/Release/"*.nupkg \
            -k "${{ secrets.NUGET_API_KEY }}" \
            -s https://api.nuget.org/v3/index.json

  release:
    name: Publish GitHub Release

    needs: publish

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
