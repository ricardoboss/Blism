name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths:
      - .github/workflows/publish.yml

jobs:
  discover:
    name: Discover Packages

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.discovery.outputs.matrix }}

    steps:
      - uses: actions/checkout@v6

      - name: Discover Projects
        id: discovery
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          entries=()

          add_package() {
            local dir="$1"

            name=$(basename "$dir")
            [[ "$name" =~ \.Test$ ]] && {
              echo "skip: ${dir} (test folder)"
              return
            }

            projects=("$dir"/*.csproj)

            if [[ "${#projects[@]}" -eq 0 ]]; then
              echo "skip: ${dir} (no csproj)"
              return
            fi

            if [[ "${#projects[@]}" -gt 1 ]]; then
              echo "::error::Multiple csproj files in ${dir}"
              exit 1
            fi

            project="${projects[0]}"

            if ! grep -q '<IsPackable>true</IsPackable>' "$project"; then
              echo "skip: ${project} (IsPackable != true)"
              return
            fi

            entries+=("{\"project\":\"${project}\"}")
            echo "discovered: project=${project}"
          }

          # Engines/<Package>
          for dir in Engines/*/; do
            add_package "$dir"
          done

          # Themes/<Package>
          for dir in Themes/*/; do
            add_package "$dir"
          done

          # Bundles/<Package>
          for dir in Bundles/*/; do
            add_package "$dir"
          done

          # Languages/<Language>/<Package>
          for language in Languages/*/; do
            for dir in "$language"*/; do
              add_package "$dir"
            done
          done

          json="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"

          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  pack:
    name: Build & Pack

    needs: discover

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5

      - name: Build
        run: dotnet build ${{ matrix.project }} -c Release

      - name: Pack
        run: dotnet pack ${{ matrix.project }} -c Release --no-build

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  publish:
    name: Publish

    if: startsWith(github.ref, 'refs/tags/v')

    needs: pack

    runs-on: ubuntu-latest

    environment: nuget.org

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: publish

      - name: Publish NuGet Packages
        shell: bash
        run: |
          shopt -s nullglob
          dotnet nuget push publish/*.nupkg \
            -k "${{ secrets.NUGET_API_KEY }}" \
            -s https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
